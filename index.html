<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spelling Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #2457a6;
    }

    #maskedWord {
      font-size: 42px;
      letter-spacing: 8px;
      font-weight: bold;
      margin: 25px 0;
    }

    #clue {
      font-size: 18px;
      color: #555;
    }

    input {
      font-size: 24px;
      padding: 12px;
      width: 85%;
      max-width: 400px;
      border-radius: 10px;
      border: 2px solid #ccc;
      text-align: center;
    }

    button {
      margin: 10px;
      padding: 12px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #2457a6;
      color: white;
      cursor: pointer;
    }

    .secondary {
      background: #666;
    }

    #feedback {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .correct {
      color: green;
    }

    .wrong {
      color: red;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Spelling Practice</h1>
    <p>Fill in the blanks and type the full word.</p>

    <p id="clue"></p>
    <div id="maskedWord"></div>

    <input id="answer" type="text" placeholder="Type the full word">

    <br>

    <button onclick="checkAnswer()">Check</button>
    <button class="secondary" onclick="showAnswer()">Show Answer</button>
    <button onclick="nextWord()">Next</button>

    <p id="feedback"></p>
  </div>

  <script>
    const words = [
      { word: "accidentally", clue: "Happening by mistake" },
      { word: "believe", clue: "To think something is true" },
      { word: "bicycle", clue: "A vehicle with two wheels" },
      { word: "calendar", clue: "Shows days, weeks and months" },
      { word: "complete", clue: "Finished; nothing missing" },
      { word: "different", clue: "Not the same" },
      { word: "difficult", clue: "Not easy" },
      { word: "favourite", clue: "The one you like best" },
      { word: "important", clue: "Something that matters" },
      { word: "knowledge", clue: "Things you know" },
      { word: "medicine", clue: "Used when someone is ill" },
      { word: "probably", clue: "Likely to happen" },
      { word: "question", clue: "Something you ask" }
    ];

    let currentIndex = 0;
    let currentWord = "";

    const clueEl = document.getElementById("clue");
    const maskedWordEl = document.getElementById("maskedWord");
    const answerEl = document.getElementById("answer");
    const feedbackEl = document.getElementById("feedback");

    function makeMaskedWord(word) {
      let result = "";

      for (let i = 0; i < word.length; i++) {
        if (i === 0 || i === word.length - 1 || i % 3 === 0) {
          result += word[i] + " ";
        } else {
          result += "_ ";
        }
      }

      return result;
    }

    function loadWord() {
      currentWord = words[currentIndex].word.toLowerCase();

      clueEl.textContent = "Clue: " + words[currentIndex].clue;
      maskedWordEl.textContent = makeMaskedWord(currentWord);
      answerEl.value = "";
      feedbackEl.textContent = "";
      feedbackEl.className = "";

      answerEl.focus();
    }

    function checkAnswer() {
      const answer = answerEl.value.trim().toLowerCase();

      if (answer === currentWord) {
        feedbackEl.textContent = "Correct! Well done.";
        feedbackEl.className = "correct";
      } else {
        feedbackEl.textContent = "Try again.";
        feedbackEl.className = "wrong";
      }
    }

    function showAnswer() {
      feedbackEl.textContent = "Answer: " + currentWord;
      feedbackEl.className = "wrong";
    }

    function nextWord() {
      currentIndex++;

      if (currentIndex >= words.length) {
        currentIndex = 0;
      }

      loadWord();
    }

    answerEl.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkAnswer();
      }
    });

    loadWord();
  </script>
</body>
</html>
