<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Year 4/5 Spelling Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #2457a6;
    }

    .word-box {
      font-size: 2.2rem;
      letter-spacing: 8px;
      margin: 24px 0;
      font-weight: bold;
      color: #111;
      word-break: break-word;
    }

    .hint {
      font-size: 1rem;
      color: #555;
      margin-bottom: 18px;
    }

    input {
      width: 90%;
      max-width: 420px;
      padding: 14px;
      font-size: 1.2rem;
      border: 2px solid #ccc;
      border-radius: 10px;
      text-align: center;
    }

    button {
      margin: 10px 6px;
      padding: 12px 18px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #2457a6;
      color: white;
    }

    button.secondary {
      background: #666;
    }

    button.success {
      background: #16803c;
    }

    button:hover {
      opacity: 0.9;
    }

    .feedback {
      min-height: 32px;
      margin-top: 16px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .correct {
      color: #16803c;
    }

    .wrong {
      color: #c62828;
    }

    .score {
      display: flex;
      justify-content: space-around;
      background: #eef3ff;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .word-list-note {
      margin-top: 24px;
      font-size: 0.9rem;
      color: #666;
      text-align: left;
      background: #f8f8f8;
      padding: 12px;
      border-radius: 10px;
    }

    @media (max-width: 480px) {
      .word-box {
        font-size: 1.7rem;
        letter-spacing: 5px;
      }

      .container {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Spelling Practice</h1>
    <p>Fill in the blanks and type the full word.</p>

    <div class="score">
      <div>Score: <span id="score">0</span></div>
      <div>Word: <span id="word-number">1</span>/<span id="total-words">0</span></div>
    </div>

    <div id="hint" class="hint"></div>
    <div id="masked-word" class="word-box"></div>

    <input id="answer" type="text" placeholder="Type the full word" autocomplete="off" />

    <div>
      <button onclick="checkAnswer()">Check</button>
      <button class="secondary" onclick="showAnswer()">Show answer</button>
      <button class="success" onclick="nextWord()">Next word</button>
    </div>

    <div id="feedback" class="feedback"></div>

    <div class="word-list-note">
      <strong>Tip for parents:</strong> Edit the word list inside the code to match the spellings given by school each term.
    </div>
  </div>

  <script>
    const WORDS = [
      { word: "accidentally", clue: "Happening by mistake" },
      { word: "believe", clue: "To think something is true" },
      { word: "bicycle", clue: "A vehicle with two wheels" },
      { word: "calendar", clue: "Shows days, weeks and months" },
      { word: "complete", clue: "Finished; nothing missing" },
      { word: "different", clue: "Not the same" },
      { word: "difficult", clue: "Not easy" },
      { word: "exercise", clue: "Physical activity" },
      { word: "favourite", clue: "The one you like best" },
      { word: "important", clue: "Something that matters" },
      { word: "knowledge", clue: "Things you know" },
      { word: "medicine", clue: "Used when someone is ill" },
      { word: "particular", clue: "Specific or special" },
      { word: "probably", clue: "Likely to happen" },
      { word: "question", clue: "Something you ask" }
    ];

    let currentIndex = 0;
    let score = 0;
    let currentWord = "";

    const maskedWordEl = document.getElementById("masked-word");
    const hintEl = document.getElementById("hint");
    const answerEl = document.getElementById("answer");
    const feedbackEl = document.getElementById("feedback");
    const scoreEl = document.getElementById("score");
    const wordNumberEl = document.getElementById("word-number");
    const totalWordsEl = document.getElementById("total-words");

    totalWordsEl.textContent = WORDS.length;

    function maskWord(word) {
      const letters = word.split("");
      const visibleLetters = new Set();

      visibleLetters.add(0);
      visibleLetters.add(word.length - 1);

      const blanksToCreate = Math.max(2, Math.floor(word.length / 2));

      while (visibleLetters.size < word.length - blanksToCreate) {
        const randomIndex = Math.floor(Math.random() * word.length);
        visibleLetters.add(randomIndex);
      }

      return letters
        .map((letter, index) => visibleLetters.has(index) ? letter : "_")
        .join(" ");
    }

    function loadWord() {
      currentWord = WORDS[currentIndex].word.toLowerCase();

      maskedWordEl.textContent = maskWord(currentWord);
      hintEl.textContent = "Clue: " + WORDS[currentIndex].clue;
      wordNumberEl.textContent = currentIndex + 1;

      answerEl.value = "";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";

      answerEl.focus();
    }

    function checkAnswer() {
      const userAnswer = answerEl.value.trim().toLowerCase();

      if (!userAnswer) {
        feedbackEl.textContent = "Type your answer first.";
        feedbackEl.className = "feedback wrong";
        return;
      }

      if (userAnswer === currentWord) {
        feedbackEl.textContent = "Correct! Well done.";
        feedbackEl.className = "feedback correct";
        score++;
        scoreEl.textContent = score;
      } else {
        feedbackEl.textContent = "Not quite. Try again or show the answer.";
        feedbackEl.className = "feedback wrong";
      }
    }

    function showAnswer() {
      feedbackEl.textContent = "Answer: " + currentWord;
      feedbackEl.className = "feedback wrong";
    }

    function nextWord() {
      currentIndex++;

      if (currentIndex >= WORDS.length) {
        currentIndex = 0;
        feedbackEl.textContent = "Round finished! Starting again.";
      }

      loadWord();
    }

    answerEl.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkAnswer();
      }
    });

    loadWord();
  </script>
</body>
</html>
